sonar.projectKey=notes-mern-frontend
sonar.projectName=notes-mern-frontend
sonar.projectVersion=1.0

sonar.sources=src

sonar.sourceEncoding=UTF-8

sonar.host.url=http://localhost:9000

# Excluded folders
sonar.exclusions=node_modules/**,dist/**,coverage/**,src/test/**

# Align coverage scope with Vitest (shadcn UI primitives and app bootstrap)
sonar.coverage.exclusions=**/components/ui/**,src/main.tsx,src/constants/**,src/test/**

# TypeScript config
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage report
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info